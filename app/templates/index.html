<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>暗裔远征：剑魔 VS 蒙多</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/combat-effects.css">
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="brand"><span>暗裔远征</span><small>海克斯大乱斗</small></div>
    <div id="run-stats" aria-live="polite"></div>
  </header>
  <main id="game-shell">
    <section id="scene-map" class="scene" aria-live="polite">
      <div class="landing"><p class="eyebrow">AATROX VS DR. MUNDO</p><h1>踏上暗裔远征</h1><p>选择路线、锻造装备、寻找足以斩杀蒙多的力量。</p><button id="start" class="primary-action">开始远征</button></div>
    </section>
    <section id="scene-battle" class="scene" aria-live="polite" hidden></section>
    <section id="scene-event" class="scene" aria-live="polite" hidden></section>
  </main>
  <aside id="activity-log" aria-label="冒险记录"><h2>战斗记录</h2><ol id="log-lines"><li>远征尚未开始。</li></ol></aside>
  <div id="modal-root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
